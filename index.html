<h1>Homelab Frame Art</h1>
<p>Homelab Frame Art is a personal, single-user tool running on a private home server. It uploads public-domain paintings to one Google Photos album so a TV can show them as a rotating seasonal slideshow.</p>
<p>It is not offered to the public and has no other users.</p>
